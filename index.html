<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>今天喝点啥？奶茶大转盘</title>
    <style>
        :root {
            --bg1: #f5f7fa;
            --bg2: #c3cfe2;
            --text: #2f3542;
            --title: #333333;
            --ring: #ffffff;
            --label: #333333;
            --accent: #ff4757;
            --accent-hover: #ff6b81;
            --accent-shadow: rgba(255, 71, 87, 0.4);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --bg1: #1e2230;
                --bg2: #2b3147;
                --text: #f1f2f6;
                --title: #f1f2f6;
                --ring: #3a4160;
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg1: #1e2230;
            --bg2: #2b3147;
            --text: #f1f2f6;
            --title: #f1f2f6;
            --ring: #3a4160;
        }
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        h1 {
            color: var(--title);
            margin: 0 16px 28px;
            font-size: clamp(20px, 6vw, 28px);
            text-align: center;
        }
        .wheel-container {
            position: relative;
            width: min(86vw, 400px);
            aspect-ratio: 1 / 1;
        }
        #wheel {
            display: block;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 10px solid var(--ring);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }
        #pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 38px solid var(--accent);
            filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.3));
            z-index: 10;
        }
        #btn {
            margin-top: 30px;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: var(--accent);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px var(--accent-shadow);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        #btn:hover { background-color: var(--accent-hover); transform: scale(1.05); }
        #btn:active { transform: scale(0.95); }
        #btn:disabled { opacity: 0.7; cursor: default; }
        #result {
            margin: 20px 16px 0;
            min-height: 30px;
            font-size: clamp(17px, 5vw, 22px);
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>🥤 今天喝哪家奶茶？</h1>

    <div class="wheel-container">
        <div id="pointer"></div>
        <canvas id="wheel" width="800" height="800"></canvas>
    </div>

    <button id="btn">开始抽奖</button>
    <div id="result"></div>

    <script>
        const brands = ["霸王茶姬", "喜茶", "奈雪的茶", "茶颜悦色", "一点点", "CoCo都可", "古茗", "沪上阿姨", "蜜雪冰城", "茉莉奶白", "林里", "煲珠公", "爷爷不泡茶", "宝藏绿洲", "瑞幸", "书亦烧仙草", "东方墨兰", "茶百道", "库迪咖啡"];
        const colors = ["#ff9ff3", "#feca57", "#ff6b6b", "#48dbfb", "#1dd1a1", "#a29bfe", "#ffeaa7", "#fab1a0", "#74b9ff", "#55efc4"];

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('btn');
        const resultDiv = document.getElementById('result');

        const numSegments = brands.length;
        const anglePerSegment = (2 * Math.PI) / numSegments;
        let currentRotation = 0;
        let isRotating = false;

        // 画布内部是 800x800，按 400 的坐标绘制，高清屏上更清晰
        function drawWheel() {
            ctx.setTransform(2, 0, 0, 2, 0, 0);
            ctx.clearRect(0, 0, 400, 400);
            for (let i = 0; i < numSegments; i++) {
                const angle = i * anglePerSegment;

                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 200, angle, angle + anglePerSegment);
                ctx.lineTo(200, 200);
                ctx.fill();

                ctx.save();
                ctx.translate(200, 200);
                ctx.rotate(angle + anglePerSegment / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#333333";
                ctx.font = "bold 15px sans-serif";
                ctx.fillText(brands[i], 180, 5);
                ctx.restore();
            }
        }

        drawWheel();

        btn.addEventListener('click', () => {
            if (isRotating) return;
            isRotating = true;
            btn.disabled = true;
            resultDiv.innerText = "正在决定你的命运...";

            currentRotation += Math.random() * 1800 + 1800;
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isRotating = false;
                btn.disabled = false;

                // 指针在正上方（画布坐标 270°），转盘顺时针转 R 度后，指针下方的原始角度 = 270 - R
                const deg = (((270 - currentRotation) % 360) + 360) % 360;
                const selectedIndex = Math.floor(deg / (360 / numSegments));

                resultDiv.innerText = `🎉 恭喜你抽中：【${brands[selectedIndex]}】！`;
            }, 4000);
        });
    </script>
</body>
</html>
